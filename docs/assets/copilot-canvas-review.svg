<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Copilot app canvas review flow</title>
  <desc id="desc">A mockup of a Simulink Model Diff review canvas showing trust, scope, evidence, and decision panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #e5eefb; }
      .label { font: 600 22px 'Segoe UI', Arial, sans-serif; fill: #e5eefb; }
      .small { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .muted { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #9fb2d6; }
      .card { fill: rgba(15,23,42,0.9); stroke: rgba(148,163,184,0.35); stroke-width: 2; }
      .pill { fill: rgba(148,163,184,0.12); stroke: rgba(148,163,184,0.25); }
      .badge { fill: rgba(96,165,250,0.18); stroke: rgba(96,165,250,0.6); }
      .score { fill: rgba(74,222,128,0.16); stroke: rgba(74,222,128,0.65); }
      .warn { fill: rgba(251,191,36,0.16); stroke: rgba(251,191,36,0.7); }
      .danger { fill: rgba(239,68,68,0.15); stroke: rgba(239,68,68,0.7); }
      .line { stroke: rgba(148,163,184,0.45); stroke-width: 2; }
      .node { fill: rgba(15,23,42,0.9); stroke: rgba(96,165,250,0.65); stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>

  <text x="70" y="74" class="title">Simulink Model Drift review canvas</text>
  <rect x="70" y="100" width="1260" height="640" rx="26" class="card"/>

  <rect x="102" y="132" width="220" height="72" rx="16" class="badge"/>
  <text x="212" y="174" text-anchor="middle" class="label">Trust</text>
  <text x="212" y="194" text-anchor="middle" class="muted">Status: partial</text>

  <rect x="350" y="132" width="220" height="72" rx="16" class="pill"/>
  <text x="460" y="174" text-anchor="middle" class="label">Scope</text>
  <text x="460" y="194" text-anchor="middle" class="muted">7 changed models</text>

  <rect x="598" y="132" width="220" height="72" rx="16" class="pill"/>
  <text x="708" y="174" text-anchor="middle" class="label">Evidence</text>
  <text x="708" y="194" text-anchor="middle" class="muted">Before/after diff</text>

  <rect x="846" y="132" width="220" height="72" rx="16" class="score"/>
  <text x="956" y="174" text-anchor="middle" class="label">Decision</text>
  <text x="956" y="194" text-anchor="middle" class="muted">Reviewer decision required</text>

  <rect x="102" y="240" width="420" height="390" rx="20" class="node"/>
  <text x="128" y="276" class="label">Changed models</text>
  <rect x="126" y="296" width="370" height="52" rx="12" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.55)"/>
  <text x="144" y="329" class="small">controller/BlockA</text>
  <rect x="126" y="362" width="370" height="52" rx="12" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.55)"/>
  <text x="144" y="395" class="small">observer/StateFlow</text>
  <rect x="126" y="428" width="370" height="52" rx="12" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.7)"/>
  <text x="144" y="461" class="small">plant/IntegratorGain</text>
  <rect x="126" y="494" width="370" height="52" rx="12" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.7)"/>
  <text x="144" y="527" class="small">safety/TripLogic</text>

  <rect x="560" y="240" width="330" height="390" rx="20" class="node"/>
  <text x="586" y="276" class="label">Evidence map</text>
  <path d="M 586 312 L 850 312" class="line"/>
  <circle cx="620" cy="356" r="18" fill="url(#red)"/>
  <circle cx="700" cy="356" r="18" fill="url(#amber)"/>
  <circle cx="780" cy="356" r="18" fill="url(#green)"/>
  <path d="M 620 410 L 760 410" class="line"/>
  <path d="M 620 470 L 760 470" class="line"/>
  <path d="M 620 530 L 760 530" class="line"/>
  <rect x="608" y="392" width="116" height="32" rx="10" class="danger"/>
  <text x="666" y="414" text-anchor="middle" class="small">gain: 0.9</text>
  <rect x="614" y="452" width="130" height="32" rx="10" class="warn"/>
  <text x="679" y="474" text-anchor="middle" class="small">deadzone: 12</text>
  <rect x="632" y="512" width="122" height="32" rx="10" class="score"/>
  <text x="693" y="534" text-anchor="middle" class="small">link: same</text>

  <rect x="930" y="240" width="330" height="390" rx="20" class="node"/>
  <text x="956" y="276" class="label">Assessment</text>
  <rect x="958" y="308" width="272" height="120" rx="16" class="warn"/>
  <text x="1094" y="344" text-anchor="middle" class="label">Qualified extraction needed</text>
  <text x="1094" y="382" text-anchor="middle" class="small">The review is not clean until the approved</text>
  <text x="1094" y="404" text-anchor="middle" class="small">extractor confirms the full model set.</text>
  <rect x="958" y="456" width="272" height="120" rx="16" class="score"/>
  <text x="1094" y="500" text-anchor="middle" class="label">Recommended next step</text>
  <text x="1094" y="536" text-anchor="middle" class="small">Ask the agent to refresh after the</text>
  <text x="1094" y="558" text-anchor="middle" class="small">licensed extractor completes.</text>

  <text x="70" y="788" class="small">Why this helps: reviewers see trust, scope, evidence, and decision together instead of reading raw JSON.</text>
</svg>
