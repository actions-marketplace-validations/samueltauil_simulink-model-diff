<svg xmlns="http://www.w3.org/2000/svg" width="600" height="410"
  viewBox="0 0 600 410" role="img" aria-labelledby="title desc">
  <title id="title">Simulink model drift summary</title>
  <desc id="desc">Analysis Complete, policy Failed,
    with deterministic change counts.</desc>
  <style>
    .title { font: 700 24px system-ui, sans-serif; fill: #111827; }
    .meta { font: 600 15px system-ui, sans-serif; fill: #374151; }
    .label { font: 15px system-ui, sans-serif; fill: #374151; }
    .value { font: 700 15px ui-monospace, monospace; fill: #111827; text-anchor: end; }
  </style>
  <rect width="600" height="410" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="560" height="370" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text id="title-text" x="44" y="64" class="title">Simulink Model Drift</text>
  <text x="44" y="100" class="meta">Analysis: Complete</text>
  <rect x="399" y="76" width="157" height="34" rx="17" fill="#fee2e2"/>
  <text x="477" y="99" class="meta" fill="#991b1b"
    text-anchor="middle">Policy: Failed</text>
  <line x1="44" y1="132" x2="556" y2="132" stroke="#e2e8f0"/>
  <text x="44" y="178" class="label">Added</text>
  <text x="556" y="178" class="value">1</text>
  <text x="44" y="212" class="label">Removed</text>
  <text x="556" y="212" class="value">0</text>
  <text x="44" y="246" class="label">Modified</text>
  <text x="556" y="246" class="value">2</text>
  <text x="44" y="280" class="label">Moved</text>
  <text x="556" y="280" class="value">0</text>
  <text x="44" y="314" class="label">Interface changes</text>
  <text x="556" y="314" class="value">1</text>
  <text x="44" y="348" class="label">Policy findings</text>
  <text x="556" y="348" class="value">2</text>
</svg>
