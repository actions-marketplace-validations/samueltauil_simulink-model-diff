name: Simulink model drift

on:
  pull_request:
    paths:
      - "**/*.slx"
      - "**/*.mdl"
      - "**/*.model.json"

permissions:
  contents: read

jobs:
  model-drift:
    name: Analyze Simulink model drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Analyze model drift
        id: drift
        uses: samueltauil/simulink-model-diff@v0.4.0
        with:
          include: |
            models/**/*.slx
            canonical/**/*.model.json
          fail-on: error

      - name: Upload model drift reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulink-model-drift-${{ github.run_id }}
          path: build/model-drift
          if-no-files-found: warn
          retention-days: 14
