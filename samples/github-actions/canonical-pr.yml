name: Simulink model drift

on:
  pull_request:
    paths:
      - "**/*.slx"
      - "**/*.mdl"
      - "**/*.model.json"
      - "model-drift/rules/**"

permissions:
  contents: read
  security-events: write

jobs:
  model-drift:
    uses: samueltauil/simulink-model-diff/.github/workflows/pr-analysis.yml@v0.3.0
    with:
      include: |
        models/**/*.slx
        canonical/**/*.model.json
      rules: model-drift/rules/default-rules.yml
      fail-on: error
      upload-sarif: true
