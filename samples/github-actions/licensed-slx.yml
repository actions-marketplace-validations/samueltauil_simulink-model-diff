name: Licensed Simulink model drift

on:
  workflow_dispatch:
    inputs:
      base-ref:
        description: Trusted base commit or tag
        required: true
      head-ref:
        description: Trusted head commit or tag
        required: true
        default: main

permissions:
  contents: read

jobs:
  analyze:
    environment: simulink-analysis
    runs-on:
      - self-hosted
      - simulink
      - ephemeral
    timeout-minutes: 45
    steps:
      - name: Check out trusted history
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs['head-ref'] }}
          fetch-depth: 0
          persist-credentials: false

      - name: Analyze with the reviewed licensed extractor
        uses: samueltauil/simulink-model-diff@v0.5.0
        with:
          base-ref: ${{ inputs['base-ref'] }}
          head-ref: ${{ inputs['head-ref'] }}
          include: models/**/*.slx
          extractor-command: >-
            python tools/run_matlab_extractor.py {artifact}
          output: build/model-drift
          fail-on: error

      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulink-model-drift-${{ github.run_id }}
          path: build/model-drift/
          if-no-files-found: warn
          retention-days: 14
