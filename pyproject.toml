[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "simulink-model-drift"
version = "0.3.0"
description = "Deterministic contracts and tooling for semantic Simulink model drift analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Simulink Model Drift Analyzer contributors" }]
keywords = ["simulink", "model-diff", "sarif", "github-actions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
simulink-model-drift = "model_drift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_drift"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/src",
  "/tests",
  "/model-drift",
  "/samples",
  "/docs",
  "/tools",
  "/action.yml",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/README.md",
  "/ROADMAP.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
