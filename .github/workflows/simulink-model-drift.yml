name: CI

on:
  pull_request:
    paths:
      - "action.yml"
      - "src/**"
      - "tests/**"
      - "model-drift/**"
      - "examples/**"
      - ".github/**"
      - "pyproject.toml"
      - "*.md"
      - "docs/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulink-model-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test package and action
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Validate package and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest
          python -m build
          simulink-model-drift validate canonical \
            examples/canonical/controller-base.model.json
          simulink-model-drift validate canonical \
            examples/canonical/controller-target.model.json

      - name: Validate PR action metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import yaml

          for path in (
              "action.yml",
              ".github/workflows/pr-analysis.yml",
              "examples/github-actions/canonical-pr.yml",
              "examples/github-actions/licensed-slx.yml",
          ):
              with pathlib.Path(path).open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
          PY
