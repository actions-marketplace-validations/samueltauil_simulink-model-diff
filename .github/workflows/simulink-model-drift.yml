name: CI

on:
  pull_request:
    paths:
      - "action.yml"
      - "src/**"
      - "tests/**"
      - "model-drift/**"
      - "examples/**"
      - ".github/**"
      - "pyproject.toml"
      - "*.md"
      - "docs/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulink-model-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test package and action
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Validate package and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest
          python -m build
          simulink-model-drift validate canonical \
            examples/canonical/controller-base.model.json
          simulink-model-drift validate canonical \
            examples/canonical/controller-target.model.json

      - name: Run composite action
        uses: ./
        with:
          base: examples/canonical/controller-base.model.json
          target: examples/canonical/controller-target.model.json
          rules: examples/rules/default-rules.yml
          output-dir: build/action-smoke
          fail-on: none

      - name: Verify action outputs
        run: |
          simulink-model-drift validate drift build/action-smoke/model-drift.json
          test -s build/action-smoke/model-drift.md
          test -s build/action-smoke/model-drift.sarif
          test -s build/action-smoke/model-drift.svg

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/action-smoke/model-drift.md ]]; then
            echo "> Canonical contract and composite-action smoke test." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            cat build/action-smoke/model-drift.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Simulink Model Drift"
              echo
              echo "**Analysis:** Failed before a Markdown report was generated."
              echo
              echo "Inspect the workflow log and downloaded artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulink-model-drift-${{ github.run_id }}
          path: build/action-smoke/
          if-no-files-found: warn
          retention-days: 14
