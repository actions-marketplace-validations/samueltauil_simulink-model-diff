name: Simulink model drift

on:
  pull_request:
    paths:
      - "**/*.slx"
      - "src/**"
      - "tests/**"
      - "test/**"
      - "model-drift/**"
      - "examples/**"
      - ".github/workflows/simulink-model-drift.yml"
      - "pyproject.toml"
      - "requirements*.txt"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: simulink-model-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Test and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUTPUT_DIR: build/model-drift
      PYTHONPATH: src
      # Set this repository variable to the complete production analyzer command.
      SIMULINK_DIFF_COMMAND: ${{ vars.SIMULINK_DIFF_COMMAND }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Validate package and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest
          python -m build
          simulink-model-drift validate canonical \
            examples/canonical/controller-base.model.json
          simulink-model-drift validate canonical \
            examples/canonical/controller-target.model.json

      - name: Run analyzer
        id: analyze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"

          changed_models=""
          if [[ -n "${BASE_SHA:-}" ]] &&
             [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] &&
             git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed_models="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.slx')"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            changed_models="$(git diff --name-only HEAD^ HEAD -- '*.slx')"
          fi

          if [[ -n "$changed_models" && -z "${SIMULINK_DIFF_COMMAND:-}" ]]; then
            {
              echo "## Simulink Model Drift"
              echo
              echo "**Analysis:** Failed"
              echo
              echo "Changed models were detected, but the repository variable \`SIMULINK_DIFF_COMMAND\` is not configured."
              echo
              echo "The workflow will not claim that an unexamined model change is clean."
              echo
              echo '```text'
              printf '%s\n' "$changed_models"
              echo '```'
            } | tee "$OUTPUT_DIR/model-drift.md"
            exit 1
          fi

          if [[ -n "$changed_models" ]]; then
            set +e
            bash -c "$SIMULINK_DIFF_COMMAND"
            analyzer_status=$?
            set -e

            for report in model-drift.json model-drift.md model-drift.sarif model-drift.svg; do
              if [[ ! -s "$OUTPUT_DIR/$report" ]]; then
                echo "Expected analyzer output is missing: $OUTPUT_DIR/$report" >&2
                exit 1
              fi
            done
            simulink-model-drift validate drift \
              "$OUTPUT_DIR/model-drift.json"
            exit "$analyzer_status"
          else
            simulink-model-drift compare \
              --base examples/canonical/controller-base.model.json \
              --target examples/canonical/controller-target.model.json \
              --rules examples/rules/default-rules.yml \
              --output build/contract-fixture \
              --fail-on none
            simulink-model-drift validate drift \
              build/contract-fixture/model-drift.json
          fi

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$OUTPUT_DIR/model-drift.md" ]]; then
            cat "$OUTPUT_DIR/model-drift.md" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f build/contract-fixture/model-drift.md ]]; then
            echo "> Contract smoke test only; no changed SLX model was analyzed." \
              >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            cat build/contract-fixture/model-drift.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Simulink Model Drift"
              echo
              echo "**Analysis:** Failed before a Markdown report was generated."
              echo
              echo "Inspect the workflow log and downloaded artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulink-model-drift-${{ github.run_id }}
          path: |
            build/model-drift/
            build/contract-fixture/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload actionable SARIF
        if: >-
          ${{
            always() &&
            steps.analyze.outcome == 'success' &&
            hashFiles('build/model-drift/*.sarif') != '' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/model-drift
          category: simulink-model-drift
