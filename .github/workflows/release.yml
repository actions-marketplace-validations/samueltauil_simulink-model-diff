name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$package_version" || {
            echo "Tag $RELEASE_TAG does not match package version v$package_version" >&2
            exit 1
          }

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Test and build
        run: |
          python -m pytest
          python -m ruff check .
          python -m build

      - name: Validate action and reusable workflow metadata
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          for path in ("action.yml", ".github/workflows/pr-analysis.yml"):
              with pathlib.Path(path).open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
          PY

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
