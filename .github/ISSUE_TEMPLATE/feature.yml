name: Feature request
description: Propose a focused improvement to contracts, comparison, reporting, rules, or integration.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include compatibility and deterministic-output considerations.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Contracts and schemas
        - Comparison and identity
        - Rules and policy
        - Reports and SARIF
        - GitHub Actions and distribution
        - Semantic extractor integration
        - Documentation
    validations:
      required: true
