schemaVersion: "0.1.0"
extractor:
  strategy: external-command
  command: "python tools/run_matlab_extractor.py {artifact}"
  failOnIncompleteAnalysis: true
  timeoutSeconds: 300
comparison:
  identityStrategy: normalized-path
  inferMoves: false
reporting:
  outputDirectory: model-drift-output
  formats:
    - json
    - markdown
    - sarif
    - svg
policy:
  rules:
    - model-drift/rules/default-rules.yml
  failureLevels:
    - error
