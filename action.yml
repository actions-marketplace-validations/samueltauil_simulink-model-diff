name: Simulink Model Drift PR Analysis
description: Analyze Simulink model drift across a pull request and publish a reviewer summary.
author: Simulink Model Drift Analyzer contributors

branding:
  icon: git-pull-request
  color: blue

inputs:
  base-ref:
    description: Base commit SHA or ref. Defaults to the pull request base SHA.
    required: false
    default: ""
  head-ref:
    description: Head commit SHA or ref. Defaults to the pull request head SHA.
    required: false
    default: ""
  include:
    description: Comma- or newline-separated repository-relative model globs.
    required: false
    default: |
      **/*.slx
      **/*.mdl
      **/*.model.json
  rules:
    description: Repository-relative rules YAML path.
    required: false
    default: ""
  output:
    description: Directory for aggregate and per-model reports.
    required: false
    default: build/model-drift
  fail-on:
    description: Policy level that fails the action (none, warning, or error).
    required: false
    default: error
  extractor-command:
    description: >-
      Optional command that emits one canonical manifest for each model artifact.
      Use {artifact} as the path placeholder. Never expose secrets to untrusted models.
    required: false
    default: ""
  python-version:
    description: Python version installed by actions/setup-python.
    required: false
    default: "3.12"

outputs:
  output:
    description: Directory containing aggregate and per-model reports.
    value: ${{ steps.pr.outputs.output }}
  index-json:
    description: Path to model-drift-index.json.
    value: ${{ steps.pr.outputs['index-json'] }}
  summary-markdown:
    description: Path to model-drift-summary.md.
    value: ${{ steps.pr.outputs['summary-markdown'] }}
  sarif:
    description: Path to model-drift.sarif.
    value: ${{ steps.pr.outputs.sarif }}
  exit-code:
    description: Analyzer exit code; see docs/cli.md.
    value: ${{ steps.pr.outputs['exit-code'] }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Simulink Model Drift
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check "$ACTION_PATH"

    - name: Analyze pull request model drift
      id: pr
      shell: bash
      env:
        INPUT_BASE_REF: ${{ inputs['base-ref'] }}
        INPUT_HEAD_REF: ${{ inputs['head-ref'] }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_RULES: ${{ inputs.rules }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FAIL_ON: ${{ inputs['fail-on'] }}
        INPUT_EXTRACTOR_COMMAND: ${{ inputs['extractor-command'] }}
        EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_BEFORE_SHA: ${{ github.event.before }}
        EVENT_SHA: ${{ github.sha }}
      run: |
        set -uo pipefail

        base_ref="${INPUT_BASE_REF:-${EVENT_BASE_SHA:-${EVENT_BEFORE_SHA:-}}}"
        head_ref="${INPUT_HEAD_REF:-${EVENT_HEAD_SHA:-${EVENT_SHA:-}}}"

        if [[ -z "$base_ref" || -z "$head_ref" ]]; then
          echo "base-ref and head-ref are required outside a pull_request or push context." >&2
          exit 2
        fi

        case "$INPUT_FAIL_ON" in
          none|warning|error) ;;
          *)
            echo "fail-on must be one of: none, warning, error" >&2
            exit 2
            ;;
        esac

        command=(
          simulink-model-drift pr
          --base-ref "$base_ref"
          --head-ref "$head_ref"
          --output "$INPUT_OUTPUT"
          --fail-on "$INPUT_FAIL_ON"
        )

        if [[ -n "$INPUT_RULES" ]]; then
          command+=(--rules "$INPUT_RULES")
        fi

        while IFS= read -r pattern; do
          pattern="${pattern#"${pattern%%[![:space:]]*}"}"
          pattern="${pattern%"${pattern##*[![:space:]]}"}"
          [[ -n "$pattern" ]] && command+=(--include "$pattern")
        done < <(printf '%s\n' "$INPUT_INCLUDE" | tr ',' '\n')

        if [[ -n "$INPUT_EXTRACTOR_COMMAND" ]]; then
          command+=(--extractor-command "$INPUT_EXTRACTOR_COMMAND")
        fi

        set +e
        "${command[@]}"
        status=$?
        set -e

        index_json="$INPUT_OUTPUT/model-drift-index.json"
        summary_markdown="$INPUT_OUTPUT/model-drift-summary.md"
        sarif="$INPUT_OUTPUT/model-drift.sarif"

        {
          echo "output=$INPUT_OUTPUT"
          [[ -f "$index_json" ]] && echo "index-json=$index_json" || echo "index-json="
          [[ -f "$summary_markdown" ]] && echo "summary-markdown=$summary_markdown" || echo "summary-markdown="
          [[ -f "$sarif" ]] && echo "sarif=$sarif" || echo "sarif="
          echo "exit-code=$status"
        } >> "$GITHUB_OUTPUT"

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          if [[ -s "$summary_markdown" ]]; then
            cat "$summary_markdown" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Simulink Model Drift"
              echo
              echo "No aggregate Markdown report was generated."
              echo
              echo "Analyzer exit code: \`$status\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

        exit "$status"
